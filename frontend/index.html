<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Care Point</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #ffffff;
      }

      #startup-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
      }

      .startup-content {
        text-align: center;
        padding: 24px;
      }

      .startup-logo {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        border-radius: 20px;
        background: linear-gradient(135deg, #006642 0%, #00984a 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 28px;
        font-weight: 900;
        box-shadow: 0 10px 30px rgba(0, 102, 66, 0.18);
      }

      .startup-title {
        margin: 0;
        color: #0f172a;
        font-size: 24px;
        font-weight: 900;
      }

      .startup-text {
        margin: 8px 0 0;
        color: #64748b;
        font-size: 14px;
      }

      .startup-spinner {
        width: 30px;
        height: 30px;
        margin: 20px auto 0;
        border: 4px solid #e2e8f0;
        border-top-color: #00984a;
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite;
      }

      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="startup-loader">
      <div class="startup-content">
        <div class="startup-logo">CP</div>
        <h1 class="startup-title">Care Point</h1>
        <p class="startup-text">Starting Care Point...</p>
        <div class="startup-spinner"></div>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
